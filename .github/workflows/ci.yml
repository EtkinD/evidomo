name: CI

on:
  push:
    branches: [main]
    # Release tags run the full pipeline and deploy (the deploy job below).
    tags: ['v*']
  pull_request:
  schedule:
    # Daily dependency audit, so new advisories surface even without code changes.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Only pull requests cancel their older runs: a push to main or a tag may carry a deploy, and a
  # cancelled run would skip it (the deploy job has its own queue below).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # shellcheck ships with the ubuntu runner image.
      - name: Shell scripts
        run: shellcheck -x infra/*.sh infra/cd/*.sh infra/load/*.sh infra/backup/backup.sh infra/provision/provision.sh .github/scripts/*.sh

      - name: Compose file
        run: >-
          POSTGRES_PASSWORD=ci LIVE_RUN_ACCESS_CODE=ci
          docker compose -f infra/compose.yaml config --quiet

      # Media conversion tests need ffmpeg, which the ubuntu runner image does not ship.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Integration tests start PostgreSQL through Testcontainers (Docker is available on ubuntu runners).
      - name: Unit and integration tests
        run: npm test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: npm audit (moderate and above fail)
        run: npm audit --audit-level=moderate

      - name: Registry signatures and attestations
        run: npm audit signatures

  # Builds the production images exactly as the deploy does (no push) and smoke-checks each one.
  # A broken image used to reach main unnoticed because only the deploy built them.
  images:
    name: Image (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
            target: runtime
          - name: migrate
            file: apps/api/Dockerfile
            target: migrate
          - name: demo-seed
            file: apps/api/Dockerfile
            target: demo-seed
          - name: web
            file: apps/web/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Loaded into the local Docker daemon for the smoke check; nothing goes to a registry.
      # The cache is scoped per image so the four builds do not evict each other.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: evidomo-ci/${{ matrix.name }}:ci
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}

      - name: Smoke check
        run: .github/scripts/smoke-image.sh "${{ matrix.name }}" "evidomo-ci/${{ matrix.name }}:ci"

  # The browser suite on its own stack (web :3100, API :4100, database evidomo_e2e), the same
  # command as local `npm run test:e2e:isolated`. The service container matches docker-compose.yml.
  e2e:
    name: End-to-end (Playwright)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: evidomo
          POSTGRES_PASSWORD: evidomo
          POSTGRES_DB: evidomo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidomo -d evidomo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # The ubuntu image ships no ffmpeg, which the audio uploads (capture spec, pipeline
      # journeys) need.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Starts the API, the web server, and the replay worker (zero model calls, no MODEL_API_KEY
      # anywhere in this job) through playwright.config.ts.
      - name: Playwright
        run: npm run test:e2e:isolated

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Continuous deployment (infra/README.md, "Continuous deployment"). A push to main deploys that
  # exact commit, a vX.Y.Z tag deploys the tag, once lint, tests, the image builds, and e2e pass.
  # The server's key only runs infra/cd/ssh-deploy.sh, which validates the ref again and prints
  # stage lines and the result only (this log is public). The SSH secrets belong to the
  # `production` environment, whose deployment rules admit main and v* tags only. The audit job
  # is not a gate (it covers dev tooling); the production dependency tree is audited here.
  deploy:
    name: Deploy to production
    needs: [checks, images, e2e]
    # DEPLOY_ENABLED (a repository variable) is the switch: unset, the job is skipped, not red.
    # A manual run of this workflow on main deploys main's head (or says it is already deployed).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # One deploy at a time; a newer pending deploy replaces an older pending one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate --package-lock-only

      - name: Deploy over SSH
        env:
          REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: .github/scripts/deploy-ssh.sh "$REF"
