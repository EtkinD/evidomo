# Listing launch service, version 1 (docs/architecture.md §5 and §7).
#
# Published versions are immutable: runs record the service ID and version, so any change to
# steps, models, efforts, or the budget goes into a new file (listing-launch.v2.yaml).
# Validated at api/worker boot by the schema in packages/shared/src/definitions.ts.
#
# Reasoning efforts and output-token caps are the per-step defaults measured in P1-02/P1-03
# (docs/model-notes.md). Spark's API default effort is `high`, so every language-model step
# states its effort, and max_output_tokens bounds the worst-case reasoning cost of one call.
service:
  id: listing-launch
  version: 1
  name: Listing launch

  inputs:
    - key: photos
      type: images
      min: 10
      max: 30
      required: true
    - key: voice_memo
      type: audio
      max_seconds: 600
      required: true
    - key: facts
      type: form
      schema: from_market_profile
      source_of_truth: true
      required: true

  steps:
    # DIARIZATION, not ENDPOINTING: on the same 2:49 walkthrough ENDPOINTING returned one turn,
    # DIARIZATION 15 turns of 2-16 s (docs/model-notes.md, P2-06). Turns are the evidence anchors
    # of transcript claims; PUSH_TO_TALK is rejected by the schema (it returns no turns). Turns
    # longer than max_turn_seconds are split with approximate, interpolated timestamps.
    - id: intake
      agent: intake
      model: muse-voice-transcribe-1.0
      transcription_mode: DIARIZATION
      max_turn_seconds: 30

    # 8000 was too small: the first live call on the 2:49 walkthrough reasoned 5.5k tokens at
    # `low` and was cut off mid-answer, dropping the last turns (docs/model-notes.md, P2-07).
    # Raised in place before any run existed.
    - id: fact_extraction
      agent: extractor
      model: muse-spark-1.3
      reasoning_effort: low
      max_output_tokens: 14000

    # Spark classifies each photo (max_output_tokens is per photo); SAM segments, no effort.
    # max_evidence_masks caps evidence segmentation per run: at most 12 SAM evidence requests
    # ($0.03) and 12 stored evidence masks. Privacy phrases run on every photo, uncapped (one SAM
    # call each, $0.0025): 30 photos x 2 phrases = $0.15 worst case (docs/model-notes.md, P2-08).
    # Spark sees a 1024-px copy of each photo: a 2048-px photo cost 4.8k input tokens against
    # 2.0k at 1024 px ($0.012 vs $0.0055 per photo); SAM gets the stored photo.
    # privacy_phrases and classification_long_edge_px added in place in P2-08, before any run.
    - id: vision_inventory
      agent: vision
      model: muse-spark-1.3
      reasoning_effort: low
      max_output_tokens: 4000
      segmentation_model: sam-3.1
      max_evidence_masks: 12
      privacy_phrases: [person, license plate]
      classification_long_edge_px: 1024

    - id: reconciliation
      agent: reconciler
      model: muse-wonder-1.0
      reasoning_effort: low
      max_output_tokens: 12000
      fallback_model: muse-spark-1.3
      fallback_reasoning_effort: medium
      gate_after: fact_conflicts

    - id: creative
      agent: creative
      model: muse-spark-1.3
      reasoning_effort: medium
      max_output_tokens: 16000

    # Its own step so roadmap cut level 1 (no Buyer Q&A) means removing just this entry.
    - id: qa_cards
      agent: qa_writer
      model: muse-spark-1.3
      reasoning_effort: low
      max_output_tokens: 8000

    # Declared-operation edits of the best-ranked stageable photos (docs/architecture.md §5,
    # P3-04). Split from creative in place in P3-04, before any run existed: verification's
    # revision loops regenerate copy only and must not re-bill image edits. One edit per staged
    # image ($0.01); integrity retries (P3-05) come on top.
    - id: staging
      agent: stager
      image_model: muse-image-1.0
      max_staged_images: 3

    - id: integrity
      agent: integrity_checker
      segmentation_model: sam-3.1

    - id: verification
      agent: verifier
      model: muse-wonder-1.0
      reasoning_effort: low
      max_output_tokens: 12000
      fallback_model: muse-spark-1.3
      fallback_reasoning_effort: medium
      max_revision_loops: 2
      gate_after: claim_audit

    - id: export
      agent: exporter

  budget:
    # Quoted on purpose: an unquoted 0.50 is a YAML float. The schema rejects numbers so the
    # cap reaches the usage ledger as an exact decimal string.
    max_cost_usd_per_run: '1.00'
