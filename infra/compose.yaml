# Production stack: caddy, web, api, worker, postgres.
# Run from the repository root (see infra/.env.example for variables):
#   docker compose -f infra/compose.yaml --env-file infra/.env up -d --build --wait
#   docker compose -f infra/compose.yaml --env-file infra/.env --profile tools run --rm migrate
# On the server use infra/deploy.sh instead (infra/README.md).
#
# Variables are interpolated from the env file into each service's `environment` explicitly
# (no `env_file:`), so every service sees only what it needs. MODEL_API_KEY reaches api and
# worker only, never web, caddy, backup, or demo-seed; LIVE_RUN_ACCESS_CODE reaches api only.
# Only caddy publishes host ports (docker bypasses ufw for published ports, so nothing else may).
#
# Resources: every service has a CPU and memory limit (deploy.resources.limits), and `web` runs
# WEB_REPLICAS copies; all of it comes from the env file, with defaults sized for the documented
# minimum host (4 GB RAM, 2 vCPU). The limits of the running stack must add up to at most 80% of
# the host (infra/README.md, "Sizing"); infra/deploy.sh warns when they do not. Limits are per
# container, so a replicated service multiplies. `api` is deliberately a single instance: its rate
# limits and open-stream caps live in process memory (docs/architecture.md section 13).

# Distinct from the local dev project (docker-compose.yml at the root), so volumes never collide.
name: evidomo-prod

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-evidomo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@postgres:5432/${POSTGRES_DB:-evidomo}
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  # Required by api and worker in production (they fail at boot when it is empty).
  DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-}
  # Storage volume mount point for uploaded materials and generated artifacts.
  STORAGE_DIR: /data
  # Public origin of the site, e.g. https://evidomo.example (CSRF Origin check, Secure
  # __Host- session cookie). Required by api and worker in production.
  APP_ORIGIN: ${APP_ORIGIN:-}

services:
  caddy:
    build:
      context: ./caddy
    image: ${IMAGE_PREFIX:-evidomo}-caddy:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      WWW_ADDRESS: ${WWW_ADDRESS:-http://www.invalid}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    deploy:
      resources:
        limits:
          cpus: ${CADDY_CPUS:-0.15}
          memory: ${CADDY_MEMORY:-128M}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    # Healthcheck comes from the image (Caddy admin API on localhost).

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the client bundle at build time (absolute og:image URLs); not a secret.
        NEXT_PUBLIC_SITE_ORIGIN: ${NEXT_PUBLIC_SITE_ORIGIN:-}
    image: ${IMAGE_PREFIX:-evidomo}-web:latest
    restart: unless-stopped
    init: true
    # Stateless (static pages, no sessions, no in-process caches), so any number of copies works.
    # Caddy finds them through the service name (infra/caddy/Caddyfile). No container_name and no
    # published ports: both would stop a second copy from starting.
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      resources:
        limits:
          cpus: ${WEB_CPUS:-0.3}
          memory: ${WEB_MEMORY:-384M}
    networks: [edge]
    # Healthcheck comes from the image (GET / on port 3000).

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: ${IMAGE_PREFIX:-evidomo}-api:latest
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: 4000
      # Api only (the worker never starts runs): the access code for live runs (P4-10).
      # Required, so compose refuses to start the stack without it. Generate one with
      # `openssl rand -base64 18`; never commit it.
      LIVE_RUN_ACCESS_CODE: ${LIVE_RUN_ACCESS_CODE:?set LIVE_RUN_ACCESS_CODE in the env file}
      # Optional; empty means the defaults (2000 requests per 15 min and 3 open replay streams per
      # client IP). Raised only for a load test window, which sends all traffic from one address.
      DEMO_REQUESTS_PER_IP_PER_15_MIN: ${DEMO_REQUESTS_PER_IP_PER_15_MIN:-}
      DEMO_STREAMS_PER_IP: ${DEMO_STREAMS_PER_IP:-}
      # Optional; empty means the default (3 and 5 run starts per 24 h, 10 wrong codes per hour).
      RUN_STARTS_PER_ACCOUNT_PER_DAY: ${RUN_STARTS_PER_ACCOUNT_PER_DAY:-}
      RUN_STARTS_PER_IP_PER_DAY: ${RUN_STARTS_PER_IP_PER_DAY:-}
      ACCESS_CODE_FAILURES_PER_IP_PER_HOUR: ${ACCESS_CODE_FAILURES_PER_IP_PER_HOUR:-}
      # Completed demo runs served publicly without login (P4-09); empty serves none.
      DEMO_RUN_IDS: ${DEMO_RUN_IDS:-}
      # Proxies trusted for the client IP (rate limits). Empty means 1 in production: Caddy.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      # Run costs in API responses. Empty means hidden in production (operators read the ledger).
      RUN_COSTS_VISIBLE: ${RUN_COSTS_VISIBLE:-}
    # One instance on purpose: the rate limits and the open-stream cap are in-process, so each
    # extra copy would multiply them.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${API_CPUS:-0.3}
          memory: ${API_MEMORY:-384M}
    volumes:
      - storage:/data
    networks: [edge, backend]
    # Healthcheck comes from the image (GET /api/healthz, which also pings the database).

  worker:
    # Same image as api (built by the api service; compose builds before it starts anything).
    image: ${IMAGE_PREFIX:-evidomo}-api:latest
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ['node', 'src/worker.ts']
    # Longer than the worker's 25 s graceful shutdown, so in-flight steps can finish on stop.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    # One instance: it runs the live pipeline steps (ffmpeg, image work), which is the memory peak.
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPUS:-0.4}
          memory: ${WORKER_MEMORY:-1G}
    volumes:
      - storage:/data
    networks: [backend]
    # The worker has no HTTP endpoint. Liveness is process-based: a fatal error (for example
    # pg-boss failing to start) exits the process and `restart: unless-stopped` brings it back.
    # The image's API healthcheck does not apply here, so it is disabled.
    healthcheck:
      disable: true

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evidomo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-evidomo}
    # Not published to the host; reachable only on the backend network.
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPUS:-0.3}
          memory: ${POSTGRES_MEMORY:-768M}
    volumes:
      # PostgreSQL 18+ images keep data under a version subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # Daily pg_dump (custom format, compressed) plus a tarball of the storage volume, kept as
  # 7 daily + 4 weekly (infra/backup/backup.sh). Restore with infra/restore.sh. Gets the database
  # credentials only; storage is mounted read-only.
  backup:
    build:
      context: ./backup
    image: ${IMAGE_PREFIX:-evidomo}-backup:latest
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-evidomo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      PGDATABASE: ${POSTGRES_DB:-evidomo}
      # UTC, HHMM.
      BACKUP_AT: ${BACKUP_AT:-0315}
    deploy:
      resources:
        limits:
          cpus: ${BACKUP_CPUS:-0.1}
          memory: ${BACKUP_MEMORY:-128M}
    volumes:
      - backups:/backups
      - storage:/data:ro
    networks: [backend]
    # Healthcheck comes from the image (a backup younger than 26 h exists).

  # One-off: docker compose -f infra/compose.yaml --env-file infra/.env --profile tools run --rm migrate
  migrate:
    profiles: [tools]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: ${IMAGE_PREFIX:-evidomo}-migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-evidomo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@postgres:5432/${POSTGRES_DB:-evidomo}
    # One-off jobs (tools profile) are not part of the running stack; their limits only cap how
    # much a run can take from the headroom the sizing rule leaves.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks: [backend]

  # One-off: docker compose -f infra/compose.yaml --env-file infra/.env --profile tools run --rm demo-seed
  # Seeds a public demo run from the committed synthetic fixtures (zero model calls) and prints
  # its ID for DEMO_RUN_IDS. Run migrations first. No MODEL_API_KEY on purpose.
  demo-seed:
    profiles: [tools]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: demo-seed
    image: ${IMAGE_PREFIX:-evidomo}-demo-seed:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-evidomo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}@postgres:5432/${POSTGRES_DB:-evidomo}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-}
      STORAGE_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
      - storage:/data
    networks: [backend]

networks:
  # caddy, web, api. The database is not reachable from here.
  edge:
  # api, worker, postgres.
  backend:

volumes:
  postgres-data:
  storage:
  backups:
  caddy-data:
  caddy-config:
