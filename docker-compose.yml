# Local development services only. Production compose lives in infra/ (Track D).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: evidomo
      POSTGRES_PASSWORD: evidomo
      POSTGRES_DB: evidomo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # PostgreSQL 18+ images keep data under a version subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evidomo -d evidomo']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
